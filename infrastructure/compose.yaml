name: servicegrid-iq

services:
  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8082
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run pnpm setup:env first}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ../.data/keycloak:/opt/keycloak/data/import:ro
      - identity_data:/opt/keycloak/data
    healthcheck:
      test: [CMD, bash, '-ec', "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  db:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servicegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:env first}
      POSTGRES_DB: ${POSTGRES_DB:-servicegrid}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@servicegrid/api", "db:migrate"]
    environment:
      SEED_LOCAL_IDENTITIES: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-servicegrid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-servicegrid}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:-}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run pnpm setup:env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run pnpm setup:env}
      S3_BUCKET: servicegrid-manuals
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-}
      PORT: 3001
      AUTH_MODE: local
      PUBLIC_ORIGIN: http://localhost:8080
      OIDC_ISSUER: http://localhost:8082/realms/servicegrid
      OIDC_CLIENT_ID: servicegrid-web
      OIDC_INTERNAL_ORIGIN: http://identity:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-servicegrid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-servicegrid}
    depends_on:
      identity:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run pnpm setup:env}
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:3.85
    command: [server, '-dir=/data', '-s3', '-s3.port=9000', '-s3.config=/etc/seaweed/s3.json', '-volume.max=5']
    ports: ['127.0.0.1:9000:9000']
    volumes:
      - manual_storage:/data
      - ../.data/storage/s3.json:/etc/seaweed/s3.json:ro
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: [node, apps/api/dist/knowledge/worker.js]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-servicegrid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-servicegrid}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: servicegrid-manuals
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_started }
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

volumes:
  postgres_data:
  identity_data:
  redis_data:
  manual_storage:
