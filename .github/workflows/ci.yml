name: Application CI
on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: servicegrid
          POSTGRES_PASSWORD: ci-only-fictional-password
          POSTGRES_DB: servicegrid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U servicegrid -d servicegrid"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://servicegrid:ci-only-fictional-password@localhost:5432/servicegrid
      POSTGRES_PORT: 5433
      SEED_LOCAL_IDENTITIES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm check:docs
      - name: Verify generated application contracts
        run: |
          node scripts/generate-phase3-contract.mjs
          node scripts/generate-phase4-contract.mjs
          node scripts/generate-phase5-contract.mjs
          node scripts/generate-phase6-contract.mjs
          node scripts/generate-phase7-contract.mjs
          git diff --exit-code -- docs/api/phase-3-openapi.json docs/api/phase-4-openapi.json docs/api/phase-5-openapi.json docs/api/phase-6-openapi.json docs/api/phase-7-openapi.json
      - name: Validate Compose and run full-container smoke test
        run: |
          node scripts/setup-env.mjs
          docker compose --env-file .env -f infrastructure/compose.yaml config --quiet
          docker compose --env-file .env -f infrastructure/compose.yaml up -d --build --wait --wait-timeout 180
          docker compose --env-file .env -f infrastructure/compose.yaml run --rm migrate pnpm --filter @servicegrid/api db:seed
          pnpm smoke
      - name: Rehearse encrypted recovery, image recreation and local load
        run: |
          node scripts/recovery-drill.mjs
          node scripts/release-drill.mjs
          node scripts/run-load.mjs
      - name: Install browser and test real OIDC flow
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env -f infrastructure/compose.yaml down
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cfn-lint==1.60.1
      - run: cfn-lint infrastructure/aws/staging.yaml
      - run: bash -n infrastructure/aws/deploy.sh
