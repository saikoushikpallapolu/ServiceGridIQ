name: AWS staging release
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-staging
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: servicegrid
          POSTGRES_PASSWORD: ci-only-fictional-password
          POSTGRES_DB: servicegrid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U servicegrid -d servicegrid"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://servicegrid:ci-only-fictional-password@localhost:5432/servicegrid
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
      DATABASE_SECRET_ARN: ${{ vars.DATABASE_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build && pnpm typecheck && pnpm lint && pnpm test && pnpm check:docs
      - run: pnpm audit --prod --audit-level high
      - run: pnpm db:migrate && pnpm db:seed && pnpm test:integration
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish immutable release images
        env:
          API_REPOSITORY_URI: ${{ vars.API_REPOSITORY_URI }}
          WEB_REPOSITORY_URI: ${{ vars.WEB_REPOSITORY_URI }}
        run: |
          set -euo pipefail
          API_IMAGE="$API_REPOSITORY_URI:sha-$GITHUB_SHA"
          WEB_IMAGE="$WEB_REPOSITORY_URI:sha-$GITHUB_SHA"
          if ! aws ecr describe-images --repository-name "${API_REPOSITORY_URI#*/}" --image-ids imageTag="sha-$GITHUB_SHA" >/dev/null 2>&1; then
            docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
            docker push "$API_IMAGE"
          fi
          if ! aws ecr describe-images --repository-name "${WEB_REPOSITORY_URI#*/}" --image-ids imageTag="sha-$GITHUB_SHA" >/dev/null 2>&1; then
            docker build -f apps/web/Dockerfile -t "$WEB_IMAGE" .
            docker push "$WEB_IMAGE"
          fi
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"
      - name: Deploy through Systems Manager and check readiness
        run: node scripts/aws-dispatch.mjs
