log_format servicegrid '$remote_addr $request_method $uri $status $body_bytes_sent';
access_log /dev/stdout servicegrid;
error_log /dev/stderr crit;

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /health/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;
  }
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
